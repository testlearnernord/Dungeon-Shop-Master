<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#120f0d" />
    <meta name="description" content="A first-person dungeon shop prototype." />
    <title>Dungeon Shop Master</title>
  </head>
  <body>
    <main id="game">
      <canvas id="renderCanvas" aria-label="Dungeon shop game scene"></canvas>
      <section id="hud" aria-live="polite">
        <div class="shop-title">GALVIK'S SHOP <span>· LEVEL 5</span></div>
        <section class="day-panel" aria-label="Day clock">
          <strong id="day">Day 1</strong>
          <ol id="world-events" aria-label="Recent world events"></ol>
          <button id="end-day" type="button" aria-expanded="false" aria-controls="day-confirmation">
            End Day (N)
          </button>
          <div id="day-confirmation" hidden>
            <p>End this day?</p>
            <button id="confirm-day" type="button">Confirm Next Day (Y)</button>
            <button id="cancel-day" type="button">Cancel (Esc)</button>
          </div>
        </section>
        <div id="inventory" class="inventory"></div>
        <details class="adventurer-panel" open>
          <summary id="population-summary">Adventurers</summary>
          <p id="shop-visitors" aria-label="Shop visitors"></p>
          <ul id="adventurer-roster" aria-label="Active adventurers"></ul>
          <p class="simulation-note">Read-only · abstract floors 1–4 · no trades yet</p>
        </details>
        <div id="status" class="status">Click to enter the shop</div>
        <div class="crosshair" aria-hidden="true"></div>
        <div class="controls">
          <strong>WASD</strong> move <span>·</span> <strong>Mouse</strong> look
          <span>·</span> <strong>Wheel</strong> select
          <span>·</span> <strong>Left-click</strong> stock
          <span>·</span> <strong>Right-click</strong> remove
          <span>·</span> <strong>E</strong> interact
          <span>·</span> <strong>N / Y</strong> end / confirm day
          <span>·</span> <strong>Esc</strong> release
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
