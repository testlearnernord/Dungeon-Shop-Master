name: Long-run Gameplay Simulation Audit

on:
  push:
    branches:
      - audit/gameplay-loop-100-days-20261122
    paths:
      - tools/analysis/gameplay-100day-audit.mjs
      - .github/workflows/gameplay-100day-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Real-world 100-day scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AUDIT_DAYS: "100"
      AUDIT_SEED: "7351"
      AUDIT_MODES: "absent,consumables,equipment,full"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run real GameStore / world clock 100-day comparison
        run: node --max-old-space-size=6144 --experimental-strip-types tools/analysis/gameplay-100day-audit.mjs
      - name: Upload detailed balance and survivor telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-100day-report
          path: gameplay-100day-audit.json
          if-no-files-found: ignore
          retention-days: 14
