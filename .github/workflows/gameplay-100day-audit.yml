name: Long-run Gameplay Simulation Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/analysis/**'
      - '.github/workflows/gameplay-100day-audit.yml'
      - 'src/game/**'
      - 'tests/unit/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

# Superseded candidates must not consume the full simulation matrix.
concurrency:
  group: gameplay-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'audit/gameplay-loop-') || github.head_ref == 'audit/ghoul-combat-diagnostics-and-motion' || github.head_ref == 'experiment/ghoul-pack-attack-spacing'))
    name: Real GameStore / scripted-storefront ${{ matrix.days }}-day scenarios / ${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: "7351"
            days: "100"
            modes: "absent,consumables,equipment,full,tier1,buyback,forge,forge-ready"
          - seed: "9321"
            days: "100"
            modes: "absent,full,tier1,buyback,forge,forge-ready"
          - seed: "42"
            days: "100"
            modes: "absent,full,tier1,buyback,forge,forge-ready"
          - seed: "2026"
            days: "100"
            modes: "absent,full,tier1,buyback,forge,forge-ready"
          - seed: "42"
            days: "200"
            modes: "forge"
          - seed: "7351"
            days: "200"
            modes: "forge"
    env:
      AUDIT_DAYS: ${{ matrix.days }}
      AUDIT_SEED: ${{ matrix.seed }}
      AUDIT_MODES: ${{ matrix.modes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify audit-only combat exposure accounting
        run: node --experimental-strip-types --test tools/analysis/campaign-combat-exposure.test.mjs
      - name: Run real GameStore / world clock comparison
        run: node --max-old-space-size=6144 --experimental-strip-types tools/analysis/gameplay-100day-audit.mjs
      - name: Upload detailed balance and survivor telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-report-${{ matrix.days }}day-${{ matrix.seed }}
          path: gameplay-100day-audit.json
          if-no-files-found: ignore
          retention-days: 14
