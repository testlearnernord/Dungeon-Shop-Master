name: Long-run Gameplay Simulation Audit

on:
  push:
    branches:
      - 'audit/gameplay-loop-*'
    paths:
      - tools/analysis/gameplay-100day-audit.mjs
      - tools/analysis/campaign-progression-telemetry.mjs
      - .github/workflows/gameplay-100day-audit.yml
      - src/game/heroProgression.ts
      - src/game/liveDungeonRuntime.ts
      - src/game/dungeonDecisions.ts
      - src/game/dungeonParties.ts
      - src/game/spatialDungeonExploration.ts
      - src/game/ghoulPack.ts
      - src/game/dungeonLoot.ts
      - src/game/campaignSave.ts
      - src/game/shopArrivals.ts
      - tests/unit/liveDungeonReturnRegression.test.ts
      - tests/unit/liveDungeonWorld.test.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Real GameStore / scripted-storefront ${{ matrix.days }}-day scenarios / ${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: "7351"
            days: "100"
            modes: "absent,consumables,equipment,full,tier1,buyback,forge"
          - seed: "9321"
            days: "100"
            modes: "absent,full,tier1,buyback,forge"
          - seed: "42"
            days: "100"
            modes: "absent,full,tier1,buyback,forge"
          - seed: "2026"
            days: "100"
            modes: "absent,full,tier1,buyback,forge"
          - seed: "42"
            days: "200"
            modes: "forge"
          - seed: "7351"
            days: "200"
            modes: "forge"
    env:
      AUDIT_DAYS: ${{ matrix.days }}
      AUDIT_SEED: ${{ matrix.seed }}
      AUDIT_MODES: ${{ matrix.modes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run real GameStore / world clock 100-day comparison
        run: node --max-old-space-size=6144 --experimental-strip-types tools/analysis/gameplay-100day-audit.mjs
      - name: Upload detailed balance and survivor telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-report-${{ matrix.days }}day-${{ matrix.seed }}
          path: gameplay-100day-audit.json
          if-no-files-found: ignore
          retention-days: 14
