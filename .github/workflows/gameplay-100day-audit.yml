name: Long-run Gameplay Simulation Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/analysis/**'
      - '.github/workflows/gameplay-100day-audit.yml'
      - 'src/game/**'
      - 'tests/unit/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

# Superseded candidates must not consume the full simulation matrix.
concurrency:
  group: gameplay-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'audit/gameplay-loop-') || (github.head_ref == 'experiment/unified-boss-profile' || github.head_ref == 'experiment/combat-balance-sweep' || github.head_ref == 'experiment/shared-ranged-spacing')))
    name: Real GameStore / scripted-storefront ${{ matrix.days }}-day scenarios / ${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: "7351"
            days: "100"
            modes: "absent,consumables,equipment,full,tier1,buyback,forge"
          - seed: "9321"
            days: "100"
            modes: "absent,full,tier1,buyback,forge"
          - seed: "42"
            days: "100"
            modes: "absent,full,tier1,buyback,forge"
          - seed: "2026"
            days: "100"
            modes: "absent,full,tier1,buyback,forge"
          - seed: "42"
            days: "200"
            modes: "forge"
          - seed: "7351"
            days: "200"
            modes: "forge"
    env:
      AUDIT_DAYS: ${{ matrix.days }}
      AUDIT_SEED: ${{ matrix.seed }}
      AUDIT_MODES: ${{ matrix.modes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify audit-only combat exposure accounting
        run: node --experimental-strip-types --test tools/analysis/campaign-combat-exposure.test.mjs
      - name: Run real GameStore / world clock comparison
        run: node --max-old-space-size=6144 --experimental-strip-types tools/analysis/gameplay-100day-audit.mjs
      - name: Upload detailed balance and survivor telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-report-${{ matrix.days }}day-${{ matrix.seed }}
          path: gameplay-100day-audit.json
          if-no-files-found: ignore
          retention-days: 14

  boss-readiness:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'audit/gameplay-loop-') || (github.head_ref == 'experiment/unified-boss-profile' || github.head_ref == 'experiment/combat-balance-sweep' || github.head_ref == 'experiment/shared-ranged-spacing')))
    name: Controlled Floor-10 readiness / ${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: [7351, 9321, 42, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify audit-only combat exposure accounting
        run: node --experimental-strip-types --test tools/analysis/campaign-combat-exposure.test.mjs
      - name: Measure actual boss combat across party compositions and readiness
        run: node --experimental-strip-types tools/analysis/boss-readiness-matrix.mjs ${{ matrix.seed }} production > boss-readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: boss-readiness-${{ matrix.seed }}
          path: boss-readiness.json
          retention-days: 14

  pacing-comparison:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/living-dungeon-pacing'
    name: Ten-day Forge pacing comparison / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: v41-baseline
            ref: "364e7f75515f21494a57da429c0daaeaeabd4c10"
          - variant: v42-candidate
            ref: ${{ github.event.pull_request.head.sha }}
    env:
      AUDIT_DAYS: "10"
      AUDIT_SEED: "7351"
      AUDIT_MODES: "forge"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run identical scripted storefront policy
        run: time node --max-old-space-size=6144 --experimental-strip-types tools/analysis/gameplay-100day-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pacing-${{ matrix.variant }}
          path: gameplay-100day-audit.json
          if-no-files-found: ignore
          retention-days: 14
