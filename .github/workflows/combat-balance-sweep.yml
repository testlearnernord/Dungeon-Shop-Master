name: Combat balance profile sweep
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/analysis/combat-balance-sweep.mjs'
      - 'src/game/groupCombat.ts'
      - 'tests/unit/rangedCombatSpacing.test.ts'
      - '.github/workflows/combat-balance-sweep.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: combat-balance-sweep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  profiles:
    if: github.event_name == 'workflow_dispatch' || (github.head_ref == 'experiment/combat-balance-sweep' || github.head_ref == 'experiment/shared-ranged-spacing')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        seed: [7351, 42, 2026, 9321]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Compare single-factor profiles using the production motor
        run: node --experimental-strip-types tools/analysis/combat-balance-sweep.mjs ${{ matrix.seed }} > combat-balance.json
      - uses: actions/upload-artifact@v4
        with:
          name: combat-balance-${{ matrix.seed }}
          path: combat-balance.json
          retention-days: 14
