name: Full browser regression

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/full-browser-ci.yml']
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: full-browser-regression
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: Browser tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm test -- --shard=${{ matrix.shard }}/3
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-full-failure-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
