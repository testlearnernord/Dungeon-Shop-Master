name: Employee physical throughput audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tests/employeeThroughput.spec.ts'
      - '.github/workflows/employee-throughput.yml'

concurrency:
  group: employee-throughput-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Employee audit (${{ matrix.policy }})
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        policy: [cashier-first, restock-first]
    env:
      EMPLOYEE_AUDIT_POLICY: ${{ matrix.policy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: xvfb-run -a npx playwright test tests/employeeThroughput.spec.ts
      - name: Retain audit and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: employee-throughput-${{ matrix.policy }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
