name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build and essential checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: npx playwright install chromium
      # Keep PR checks small: core shop, checkout, mining and stock flow.
      # Full browser suite is manual-only in full-browser-ci.yml.
      - run: xvfb-run -a npm test -- tests/dayClock.spec.ts tests/cashierReceipt.spec.ts tests/level5Excavation.spec.ts tests/shopperFlowReliability.spec.ts
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-smoke-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
