name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --experimental-strip-types --test tests/unit/healingBalance.test.ts tests/unit/checkoutQueue.test.ts tests/unit/npcTraffic.test.ts

  smoke:
    name: Browser smoke tests
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Focused PR smoke: shop flow, real cashier, restocking and UI.
      # The full browser suite remains manual/nightly.
      - run: xvfb-run -a npm test -- tests/gateTraffic.spec.ts tests/cashierReceipt.spec.ts tests/restockWaiting.spec.ts tests/immersiveInterface.spec.ts
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
