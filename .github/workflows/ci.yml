name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit

  smoke:
    name: Browser smoke tests
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Exercise the FPS HUD, management panel, hero roster and shop controls.
      # Full browser regression runs nightly or on demand in full-browser-ci.yml.
      - run: xvfb-run -a npm test -- tests/controlsDisclosure.spec.ts tests/hudMouseMode.spec.ts tests/shopManagement.spec.ts tests/adventurerOverview.spec.ts tests/dayClock.spec.ts tests/cashierReceipt.spec.ts tests/gateTraffic.spec.ts tests/softNpcTraffic.spec.ts tests/restockWaiting.spec.ts
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
