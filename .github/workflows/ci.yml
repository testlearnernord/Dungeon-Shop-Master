name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify:pages
      # Stable gameplay contracts only; the complete suite is manual.
      - run: npm run test:unit:core
        if: github.head_ref != 'audit/gameplay-loop-room-first-dungeon'
      - name: Full unit regression for the geometry replacement
        if: github.head_ref == 'audit/gameplay-loop-room-first-dungeon'
        run: npm run test:unit

  smoke:
    name: Browser core smoke
    runs-on: ubuntu-24.04
    # Fifteen serial browser smokes plus install can exceed 12 minutes on slow runners.
    # Individual Playwright deadlines remain unchanged.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      # Explicit package.json whitelist; no blanket @ci-smoke discovery.
      - run: xvfb-run -a npm run test:smoke
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-core-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
